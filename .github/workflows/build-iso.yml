# Build the KOOMPI Hyprland live/install ISO with mkarchiso and publish it as a
# GitHub Release.
#
# Runs mkarchiso against the archiso profile at sdata/dist-arch/iso/koompi/. The
# live session starts koompi-install (archinstall with KOOMPI's defaults and
# profile); the installed system sets up the desktop on its first boot from main,
# the same way the one-line installer does. No [koompi] pacman repo is needed:
# pacman.conf keeps it commented out until that repo is signed and published.
#
# publish=false builds and uploads the ISO as a workflow artifact only, for the
# QEMU install test (sdata/dist-arch/iso/test/qemu-install.sh) before a release.
name: Build & Release KOOMPI Hyprland ISO

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (off = workflow artifact only)
        type: boolean
        default: true

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # mkarchiso needs root + loop devices + mount, so the container must be
      # privileged. Without this, image assembly fails on loop-device setup.
      options: --privileged
    steps:
      - name: Install archiso + release tooling
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed archiso git github-cli

      - uses: actions/checkout@v4

      - name: Sanity-check the archiso profile
        run: |
          set -euo pipefail
          test -f sdata/dist-arch/iso/koompi/profiledef.sh || {
            echo "archiso profile not scaffolded (sdata/dist-arch/iso/koompi/)." >&2
            exit 1
          }

      - name: Build the ISO
        run: |
          set -euo pipefail
          # -v verbose, -w work dir, -o output dir, then the profile directory.
          mkarchiso -v \
            -w "$RUNNER_TEMP/archiso-work" \
            -o "$GITHUB_WORKSPACE/out" \
            sdata/dist-arch/iso/koompi/

      - name: Checksum the ISO
        working-directory: out
        run: sha256sum *.iso | tee SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: koompi-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso="$(ls -- *.iso)"
          # profiledef.sh's iso_version is date-only, so the tag carries the
          # commit too: a second build the same day must not die at release
          # creation after a full mkarchiso run. A re-run of the same commit
          # replaces its own release assets instead of failing on the tag.
          tag="iso-${iso%.iso}-${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$iso" SHA256SUMS
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KOOMPI Hyprland — ${iso%.iso}" \
              --notes "Boot it, run the installer it starts, reboot: the first start sets up the KOOMPI desktop (needs the internet). Check the download with SHA256SUMS. Built from commit ${GITHUB_SHA}." \
              "$iso" SHA256SUMS
          fi

# Guards the installer, which runs on Arch and Arch-based distributions only. Not a
# full install - that needs a Wayland session and a GPU - but enough to catch the
# failures that actually happen: a shell syntax error, an Arch derivative that stops
# being detected (or another distro that starts being let in), and a files step that
# writes outside $HOME or forgets to record what it wrote.
name: Installer

on:
  # unfiltered by branch on purpose: dev and main alike run this
  push:
    paths:
      - 'setup'
      - 'sdata/lib/**'
      - 'sdata/install/**'
      - 'sdata/dist-*/install-deps.sh'
      - 'sdata/dist-*/install-apps.sh'
      - 'install.sh'
      - 'dots/**'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'setup'
      - 'sdata/lib/**'
      - 'sdata/install/**'
      - 'sdata/dist-*/install-deps.sh'
      - 'sdata/dist-*/install-apps.sh'
      - 'install.sh'
      - 'dots/**'
      - '.github/workflows/installer.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint the installer
        run: |
          shellcheck -x setup install.sh sdata/install/*.sh sdata/install/setups/*.sh
          shellcheck -x -s bash sdata/lib/*.sh
      - name: Lint the Arch recipes
        # Sourced, not executed, so shellcheck needs to be told the dialect.
        run: shellcheck -x -s bash sdata/dist-arch/install-deps.sh sdata/dist-arch/install-apps.sh

  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arch and its derivatives resolve to the recipe, nothing else does
        run: |
          set -uo pipefail
          fail=0
          # name | ID | ID_LIKE | expected group ('-' means no recipe)
          while IFS='|' read -r name id like want; do
            [ -n "$name" ] || continue
            : > /tmp/os-release
            echo "ID=$id" >> /tmp/os-release
            [ "$like" = '-' ] || echo "ID_LIKE=\"$like\"" >> /tmp/os-release
            [ "$want" = '-' ] && want=''
            got="$(KOOMPI_OS_RELEASE=/tmp/os-release bash -c '
              source sdata/lib/common.sh
              source sdata/lib/distro.sh
              detect_distro
              printf "%s" "$OS_GROUP_ID"
            ')"
            if [ "$got" = "$want" ]; then
              echo "ok   $name -> ${got:-<none>}"
            else
              echo "FAIL $name -> '${got}' (expected '${want}')"
              fail=1
            fi
          done <<'CASES'
          arch|arch|-|arch
          koompi|koompi|-|arch
          endeavouros|endeavouros|arch|arch
          cachyos|cachyos|arch|arch
          manjaro|manjaro|arch|arch
          fedora|fedora|-|-
          debian|debian|-|-
          ubuntu|ubuntu|debian|-
          mint|linuxmint|ubuntu debian|-
          unsupported|void|-|-
          CASES
          exit $fail

  files-step:
    runs-on: ubuntu-latest
    # Arch, because setup refuses anything else; as a plain user, because it refuses root
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: A user to install as
        run: |
          pacman -Syu --noconfirm --needed git rsync sudo
          useradd -m tester
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Hand the checkout to that user
        run: chown -R tester "$GITHUB_WORKSPACE"
      - name: Install into a throwaway HOME
        shell: sudo -u tester --preserve-env=GITHUB_WORKSPACE bash -e {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          fake="$(mktemp -d)"
          # A config of the user's own that the install overwrites, so the
          # backup path has something to prove at the end.
          mkdir -p "$fake/.config/hypr"
          echo '-- theirs' > "$fake/.config/hypr/hyprland.lua"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME \
              -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$fake" ./setup install --only-files -y
          test -f "$fake/.config/hypr/hyprland.lua"
          grep -qx -- '-- theirs' "$fake"/.koompi-dots-backup/*/.config/hypr/hyprland.lua
          test -d "$fake/.config/quickshell/koompi"
          test -x "$fake/.local/bin/koompi-session"
          test -s "$fake/.local/state/koompi/installed-files"
          echo "$fake" > /tmp/fakehome

      - name: Nothing was written outside HOME
        shell: sudo -u tester --preserve-env=GITHUB_WORKSPACE bash -e {0}
        run: |
          fake="$(cat /tmp/fakehome)"
          if grep -v "^$fake/" "$fake/.local/state/koompi/installed-files"; then
            echo "manifest contains paths outside the install root"; exit 1
          fi

      - name: Build artefacts did not leak into HOME
        shell: sudo -u tester --preserve-env=GITHUB_WORKSPACE bash -e {0}
        run: |
          fake="$(cat /tmp/fakehome)"
          if find "$fake" \( -name 'zig-out' -o -name '.zig-cache' -o -name '__pycache__' -o -name '.claude' \) -print | grep .; then
            echo "build artefacts were installed"; exit 1
          fi

      - name: Re-running keeps user overrides and stays idempotent
        shell: sudo -u tester --preserve-env=GITHUB_WORKSPACE bash -e {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          fake="$(cat /tmp/fakehome)"
          echo '-- mine' >> "$fake/.config/hypr/custom/keybinds.lua"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME \
              -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$fake" ./setup install --only-files -y
          tail -1 "$fake/.config/hypr/custom/keybinds.lua" | grep -qx -- '-- mine'

      - name: Uninstall leaves nothing of ours behind
        shell: sudo -u tester --preserve-env=GITHUB_WORKSPACE bash -e {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          fake="$(cat /tmp/fakehome)"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME \
              -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$fake" ./setup uninstall -y
          test ! -e "$fake/.config/quickshell/koompi"
          test ! -e "$fake/.local/bin/koompi-session"
          # ...and the backup of what was there before us is not ours to remove.
          grep -qx -- '-- theirs' "$fake"/.koompi-dots-backup/*/.config/hypr/hyprland.lua

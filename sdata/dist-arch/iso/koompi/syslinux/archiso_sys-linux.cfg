LABEL arch
TEXT HELP
Boot the KOOMPI Hyprland live/install medium on BIOS.
It boots a live session that starts the KOOMPI installer.
ENDTEXT
MENU LABEL KOOMPI Hyprland live/install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL arch_nomodeset
TEXT HELP
Boot without the graphics driver, for a screen that stays black or garbled.
ENDTEXT
MENU LABEL KOOMPI Hyprland live/install (%ARCH%, BIOS, safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

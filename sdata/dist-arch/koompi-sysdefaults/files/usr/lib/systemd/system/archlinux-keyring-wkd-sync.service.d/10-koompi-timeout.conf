# Arch's unit is a oneshot with no start timeout, so a WKD server that answers
# and then stalls holds the refresh for good (21 h on a KOOMPI machine,
# 2026-10-30). The unit's own Restart=on-failure tries again 5 min later, at
# most three times an hour; after that the weekly timer does.
[Service]
TimeoutStartSec=15min
